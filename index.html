<script>
(function () {
  var S = JSON.parse(document.getElementById("sealed").textContent), KEPT = "mg-site-key";
  var form = document.getElementById("gate"), msg = document.getElementById("msg"), go = document.getElementById("go");
  var bytes = function (b64) {
    var s = atob(b64), a = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
    return a;
  };
  var base64 = function (buf) {
    var a = new Uint8Array(buf), s = "";
    for (var i = 0; i < a.length; i += 32768) s += String.fromCharCode.apply(null, a.subarray(i, i + 32768));
    return btoa(s);
  };
  var unseal = function (key) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(S.iv) }, key, bytes(S.data)).then(function (plain) {
      return new TextDecoder().decode(plain);
    });
  };
  var show = function (html) { document.open(); document.write(html); document.close(); };
  var forget = function () { try { localStorage.removeItem(KEPT); } catch (e) {} };
  var keep = function (key) {
    return crypto.subtle.exportKey("raw", key).then(function (raw) {
      try { localStorage.setItem(KEPT, JSON.stringify({ salt: S.salt, key: base64(raw) })); } catch (e) {}
    });
  };
  if (!window.crypto || !crypto.subtle) {
    msg.textContent = "This browser cannot open the page here (it needs a secure https address).";
    go.disabled = true;
    return;
  }
  var kept = null;
  try { kept = JSON.parse(localStorage.getItem(KEPT) || "null"); } catch (e) {}
  if (kept && kept.salt === S.salt && kept.key) {
    form.style.visibility = "hidden";
    crypto.subtle.importKey("raw", bytes(kept.key), "AES-GCM", true, ["decrypt"]).then(unseal).then(show, function () {
      forget();
      form.style.visibility = "";
    });
  }
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    msg.textContent = "";
    go.disabled = true;
    go.textContent = "Opening\u2026";
    var password = document.getElementById("pw").value, remember = document.getElementById("keep").checked;
    var typed = new TextEncoder().encode(password);
    crypto.subtle.importKey("raw", typed, "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(S.salt), iterations: S.rounds, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    }).then(function (key) {
      return unseal(key).then(function (html) {
        return (remember ? keep(key) : Promise.resolve()).then(function () { show(html); });
      });
    }).catch(function () {
      go.disabled = false;
      go.textContent = "Open";
      msg.textContent = "That password does not open this page.";
      document.getElementById("pw").select();
    });
  });
})();
</script>
